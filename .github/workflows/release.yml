name: Release

run-name: Release

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prereq:
    uses: alexdlaird/.github/.github/workflows/release-prereq.yml@main
    with:
      version_file: 'pyngrok/__init__.py'
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      repo_slug: alexdlaird/pyngrok
      changelog: true
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

  build:
    needs: [prereq]
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      FORCE_COLOR: 1
      PYTHONUNBUFFERED: 1

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prereq.outputs.squash_commit_sha }}

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build package
        run: make local

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    needs: [prereq, build]
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/project/pyngrok/${{ needs.prereq.outputs.version }}

    permissions:
      id-token: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: [prereq, publish]
    runs-on: ubuntu-latest

    env:
      PYNGROK_DOCKER_GITHUB_TOKEN: ${{ secrets.PYNGROK_DOCKER_GITHUB_TOKEN }}

    steps:
      - name: Trigger pyngrok-docker Release
        if: ${{ env.PYNGROK_DOCKER_GITHUB_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.PYNGROK_DOCKER_GITHUB_TOKEN }}
          VERSION: ${{ needs.prereq.outputs.version }}
        run: |
          gh release create \
            -R alexdlaird/pyngrok-docker "${VERSION}.0" \
            --notes "Pre-built containers for [pyngrok==${VERSION}](https://pypi.org/project/pyngrok/${VERSION})."

  finish:
    needs: [prereq, publish]
    if: always() && needs.prereq.result == 'success'
    uses: alexdlaird/.github/.github/workflows/release-finish.yml@main
    with:
      shipped: ${{ needs.publish.result == 'success' }}
      version: ${{ needs.prereq.outputs.version }}
      squash_commit_sha: ${{ needs.prereq.outputs.squash_commit_sha }}
      squash_boundary_sha: ${{ needs.prereq.outputs.squash_boundary_sha }}
      build_run_id: ${{ needs.prereq.outputs.build_run_id }}
      version_file: 'pyngrok/__init__.py'
      version_pattern: 's/^__version__ = ".*"/__version__ = "${VERSION}"/'
      repo_slug: alexdlaird/pyngrok
      github_release: true
      github_release_notes: ${{ needs.prereq.outputs.release_notes }}
    secrets:
      bot_app_id: ${{ secrets.RELEASE_BOT_APP_ID }}
      bot_private_key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
